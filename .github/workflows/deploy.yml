name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build & Validate
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log environment info
        run: |
          echo "::group::Environment Info"
          echo "Runner OS     : $RUNNER_OS"
          echo "Runner Arch   : $RUNNER_ARCH"
          echo "Git SHA       : $GITHUB_SHA"
          echo "Git Ref       : $GITHUB_REF"
          echo "Triggered by  : $GITHUB_ACTOR"
          echo "Timestamp     : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          df -h / | tail -1 | awk '{print "Disk free     : "$4}'
          echo "::endgroup::"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Log Node / npm versions
        run: |
          echo "::group::Toolchain Versions"
          node --version
          npm --version
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci 2>&1
          echo "::endgroup::"
          echo "Packages installed: $(ls node_modules | wc -l)"

      - name: Compile TypeScript (NestJS build)
        id: build
        run: |
          echo "::group::NestJS Build Output"
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error title=Build Failed::TypeScript compilation failed. See 'NestJS Build Output' group above for details."
            echo "build_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "build_status=success" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build OK::TypeScript compiled successfully."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7

      - name: Write build job summary
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          if [ "$BUILD_STATUS" = "success" ]; then
            ESTADO="PASSED"
          else
            ESTADO="FAILED"
          fi
          {
            echo "## Build Summary"
            echo ""
            echo "| Campo  | Valor |"
            echo "|--------|-------|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Rama   | \`$GITHUB_REF_NAME\` |"
            echo "| Estado | $ESTADO |"
            echo "| Hora   | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Render
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://cashtracker-api-mggy.onrender.com

    steps:
      # Valida que el secret está configurado ANTES de llamar a curl
      - name: Validate RENDER_DEPLOY_HOOK_URL secret
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error title=Secret Faltante::El secret RENDER_DEPLOY_HOOK_URL no está configurado."
            echo "::error::Ve a: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Nombre: RENDER_DEPLOY_HOOK_URL"
            echo "::error::Valor:  Render Dashboard → tu servicio → Settings → Deploy Hooks → Add Deploy Hook"
            exit 1
          fi
          echo "::notice::Secret RENDER_DEPLOY_HOOK_URL detectado correctamente."

      - name: Trigger Render Deploy Hook
        id: render
        run: |
          echo "::group::Render Deploy Hook — Request"
          echo "Timestamp : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Hook URL  : [REDACTED — secret]"
          echo "::endgroup::"

          HTTP_CODE=$(curl -s \
            --max-time 30 \
            -o /tmp/render_response.json \
            -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          CURL_EXIT=$?

          echo "::group::Render Deploy Hook — Response"
          echo "curl exit code : $CURL_EXIT"
          echo "HTTP Status    : $HTTP_CODE"
          echo "Response body  :"
          python3 -m json.tool /tmp/render_response.json 2>/dev/null || cat /tmp/render_response.json
          echo "::endgroup::"

          # curl exit code 3 = URL malformada / secret vacío
          if [ "$CURL_EXIT" -eq 3 ]; then
            echo "::error title=URL Malformada (curl exit 3)::El secret RENDER_DEPLOY_HOOK_URL está vacío o tiene formato incorrecto."
            exit 1
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error title=curl Error $CURL_EXIT::Fallo de red al llamar al deploy hook. curl exit=$CURL_EXIT"
            exit 1
          fi

          DEPLOY_ID=$(python3 -c \
            "import sys, json; d=json.load(open('/tmp/render_response.json')); print(d.get('deploy',{}).get('id','unknown'))" \
            2>/dev/null || echo "unknown")

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "http_code=$HTTP_CODE"  >> "$GITHUB_OUTPUT"

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
            echo "::error title=Deploy Hook HTTP $HTTP_CODE::Render rechazó el deploy. Ver 'Render Deploy Hook — Response' arriba."
            exit 1
          fi

          echo "::notice title=Deploy Triggered::Deploy en cola en Render. Deploy ID: $DEPLOY_ID"

      - name: Write deploy summary
        if: always()
        run: |
          HTTP="${{ steps.render.outputs.http_code }}"
          DEPLOY_ID="${{ steps.render.outputs.deploy_id }}"
          {
            echo "## Render Deploy Summary"
            echo ""
            echo "| Campo      | Valor |"
            echo "|------------|-------|"
            echo "| Commit     | \`$GITHUB_SHA\` |"
            echo "| HTTP Code  | \`${HTTP:-N/A}\` |"
            echo "| Deploy ID  | \`${DEPLOY_ID:-N/A}\` |"
            echo "| Dashboard  | [Render Dashboard](https://dashboard.render.com) |"
            echo "| API URL    | [cashtracker-api-mggy.onrender.com](https://cashtracker-api-mggy.onrender.com) |"
            echo "| Hora       | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
          } >> "$GITHUB_STEP_SUMMARY"
