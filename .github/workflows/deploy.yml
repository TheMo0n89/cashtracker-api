name: Deploy to Render

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # PRE-FLIGHT — Validates all required env vars before any work starts
  # ────────────────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CHECK_RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "::group::Pre-flight Checklist — GitHub Secrets"

          FAILED=0

          # ── RENDER_DEPLOY_HOOK_URL ────────────────────────────────────
          if [ -z "$CHECK_RENDER_HOOK" ]; then
            echo "❌  RENDER_DEPLOY_HOOK_URL — SECRET FALTANTE"
            echo "    → GitHub repo (cashtracker-api) → Settings → Secrets → Actions"
            echo "    → Nombre: RENDER_DEPLOY_HOOK_URL"
            echo "    → Valor:  Render Dashboard → tu servicio → Settings → Deploy Hooks → Add Deploy Hook"
            FAILED=1
          elif ! echo "$CHECK_RENDER_HOOK" | grep -qE '^https://api\.render\.com/deploy/'; then
            echo "❌  RENDER_DEPLOY_HOOK_URL — FORMATO INVÁLIDO"
            echo "    → Debe comenzar con: https://api.render.com/deploy/"
            echo "    → Valor actual (inicio): ${CHECK_RENDER_HOOK:0:20}..."
            FAILED=1
          else
            MASKED="${CHECK_RENDER_HOOK:0:40}***"
            echo "✅  RENDER_DEPLOY_HOOK_URL — OK ($MASKED)"
          fi

          echo "::endgroup::"

          # ── Nota sobre variables de entorno en Render ────────────────
          echo "::group::Pre-flight Checklist — Variables en Render Dashboard"
          echo "Las siguientes variables deben estar configuradas en:"
          echo "  Render Dashboard → cashtracker-api → Environment"
          echo ""
          echo "  ✅  PORT                      (Render la inyecta automáticamente — NO configurar)"
          echo "  ⚙️   DB_HOST                   (debe ser: aws-1-us-east-2.pooler.supabase.com)"
          echo "  ⚙️   DB_PORT                   (debe ser: 6543)"
          echo "  ⚙️   DB_DATABASE               (debe ser: postgres)"
          echo "  ⚙️   DB_USERNAME"
          echo "  ⚙️   DB_PASSWORD"
          echo "  ⚙️   DB_SSL                    (debe ser: true)"
          echo "  ⚙️   JWT_SECRET                (mínimo 64 caracteres)"
          echo "  ⚙️   JWT_REFRESH_SECRET        (mínimo 64 caracteres)"
          echo "  ⚙️   JWT_ACCESS_EXPIRATION     (ej: 8h)"
          echo "  ⚙️   JWT_REFRESH_EXPIRATION    (ej: 7d)"
          echo "  ⚙️   CORS_ALLOWED_ORIGINS      (ej: https://cashtracker-web.vercel.app)"
          echo "  ⚙️   SUPABASE_URL"
          echo "  ⚙️   SUPABASE_PUBLISHABLE_KEY"
          echo "  ⚙️   SUPABASE_SECRET_KEY"
          echo "  ⚙️   SUPABASE_JWKS_URL"
          echo "  ⚙️   SUPABASE_STORAGE_BUCKET   (debe ser: transaction-invoices)"
          echo "  ⚙️   NODE_ENV                  (debe ser: production)"
          echo "  ⚙️   NODE_OPTIONS              (debe ser: --max-old-space-size=460)"
          echo ""
          echo "  ⚠️  NODE_OPTIONS=--max-old-space-size=460 es el máximo seguro para"
          echo "      el plan Free de Render (512 MB RAM). Si el proceso sigue muriendo"
          echo "      por OOM, el plan es insuficiente y se requiere upgrade a Starter."
          echo "::endgroup::"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=Pre-flight Failed::Uno o más secrets requeridos están ausentes o mal formados. Ver checklist arriba."
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────
  # BUILD — Compile TypeScript and validate the output
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log environment info
        run: |
          echo "::group::Environment Info"
          echo "Runner OS     : $RUNNER_OS"
          echo "Git SHA       : $GITHUB_SHA"
          echo "Git Ref       : $GITHUB_REF_NAME"
          echo "Triggered by  : $GITHUB_ACTOR"
          echo "Timestamp     : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "::endgroup::"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Log toolchain versions
        run: |
          echo "::group::Toolchain"
          node --version
          npm --version
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci 2>&1
          echo "::endgroup::"

      - name: Compile TypeScript (NestJS build)
        id: build
        run: |
          echo "::group::NestJS Build Output"
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error title=Build Failed::TypeScript compilation failed. Ver 'NestJS Build Output' arriba."
            echo "build_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "build_status=success" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build OK::TypeScript compilado correctamente."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7

      - name: Write build summary
        if: always()
        run: |
          BUILD="${{ steps.build.outputs.build_status }}"
          ESTADO=$([ "$BUILD" = "success" ] && echo "PASSED" || echo "FAILED")
          {
            echo "## Build Summary"
            echo ""
            echo "| Campo  | Valor |"
            echo "|--------|-------|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Rama   | \`$GITHUB_REF_NAME\` |"
            echo "| Estado | $ESTADO |"
            echo "| Hora   | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────
  # DEPLOY — Trigger Render via deploy hook
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://cashtracker-api-mggy.onrender.com

    steps:
      - name: Trigger Render Deploy Hook
        id: render
        run: |
          echo "::group::Render Deploy Hook — Request"
          echo "Timestamp : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit SHA: $GITHUB_SHA"
          echo "::endgroup::"

          HTTP_CODE=$(curl -s \
            --max-time 30 \
            -o /tmp/render_response.json \
            -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          CURL_EXIT=$?

          echo "::group::Render Deploy Hook — Response"
          echo "curl exit code : $CURL_EXIT"
          echo "HTTP Status    : $HTTP_CODE"
          python3 -m json.tool /tmp/render_response.json 2>/dev/null || cat /tmp/render_response.json
          echo "::endgroup::"

          if [ "$CURL_EXIT" -eq 3 ]; then
            echo "::error title=URL Malformada (curl exit 3)::RENDER_DEPLOY_HOOK_URL está vacía o mal formada."
            exit 1
          fi

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error title=curl Error $CURL_EXIT::Fallo de red. curl exit=$CURL_EXIT"
            exit 1
          fi

          DEPLOY_ID=$(python3 -c \
            "import json; d=json.load(open('/tmp/render_response.json')); print(d.get('deploy',{}).get('id','unknown'))" \
            2>/dev/null || echo "unknown")

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "http_code=$HTTP_CODE"  >> "$GITHUB_OUTPUT"

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" && "$HTTP_CODE" != "202" ]]; then
            echo "::error title=Deploy Hook HTTP $HTTP_CODE::Render rechazó el deploy. Ver response arriba."
            exit 1
          fi

          echo "::notice title=Deploy Triggered::Deploy en cola en Render. Deploy ID: $DEPLOY_ID"

      - name: Write deploy summary
        if: always()
        run: |
          HTTP="${{ steps.render.outputs.http_code }}"
          DEPLOY_ID="${{ steps.render.outputs.deploy_id }}"
          {
            echo "## Render Deploy Summary"
            echo ""
            echo "| Check | Estado |"
            echo "|-------|--------|"
            echo "| RENDER_DEPLOY_HOOK_URL | ✅ Validada en Pre-flight |"
            echo "| Build TypeScript       | ✅ Compilado |"
            echo "| Deploy Hook Response   | HTTP \`${HTTP:-N/A}\` |"
            echo ""
            echo "| Campo      | Valor |"
            echo "|------------|-------|"
            echo "| Commit     | \`$GITHUB_SHA\` |"
            echo "| Deploy ID  | \`${DEPLOY_ID:-N/A}\` |"
            echo "| Dashboard  | [Render Dashboard](https://dashboard.render.com) |"
            echo "| API URL    | [cashtracker-api-mggy.onrender.com](https://cashtracker-api-mggy.onrender.com) |"
            echo "| Hora       | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
          } >> "$GITHUB_STEP_SUMMARY"
