name: Validate Render deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: render-production-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: https://cashtracker-api-mggy.onrender.com

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  verify-production:
    name: Verify automatic Render deployment
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for the pushed commit to become healthy
        shell: bash
        run: |
          for attempt in {1..90}; do
            response="$(curl --silent --show-error --max-time 60 \
              --write-out '\n%{http_code}' \
              "$API_URL/v1/health/ready" || true)"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"

            if [[ "$status" == "200" ]] && grep -q "$GITHUB_SHA" <<<"$body"; then
              echo "Render is serving commit $GITHUB_SHA and the database is ready."
              exit 0
            fi

            echo "Attempt $attempt/90: status=${status:-unavailable}; waiting for Render."
            sleep 10
          done

          echo "::error::Render did not serve healthy commit $GITHUB_SHA within 15 minutes."
          exit 1
